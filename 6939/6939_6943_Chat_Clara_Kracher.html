<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatverlauf</title>
<meta name="description" content="Requisite SOKO Linz 2026, Block II – Chatverlauf Clara Roithamer / Adrian Kracher. Nur fuer den Dreh.">
<style>
/* ------------------------------------------------------------------
   Chatverlauf Clara Roithamer <-> Adrian Kracher
   Requisite fuer SOKO Linz 2026, Block II  --  Szenen 6939 und 6943
   Ansicht: Tablet im Hochformat, laeuft vollstaendig ohne Internet.
   Blickrichtung: Claras Telefon. Ihre Nachrichten stehen rechts,
   die von Adrian Kracher links.
   ------------------------------------------------------------------ */
:root{
  --gruen-kopf:#075e54; --gruen-eigen:#dcf8c6; --papier:#ece5dd;
  --blase-fremd:#ffffff; --text:#111b21; --grau:#667781; --haken:#53bdeb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:#3a4a46;
  font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,"Noto Sans",sans-serif;
  color:var(--text);font-size:17px;overflow:hidden;
}
.app{
  max-width:900px;margin:0 auto;height:100dvh;height:100vh;
  display:flex;flex-direction:column;background:var(--papier);
  box-shadow:0 0 40px rgba(0,0,0,.35);
}
/* ---------- Kopfleiste ---------- */
.kopf{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  background:var(--gruen-kopf);color:#fff;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
}
.kopf .pfeil{font-size:26px;line-height:1;opacity:.95;padding-right:2px}
.kopf img{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.kopf .wer{flex:1;min-width:0}
.kopf .name{font-size:18px;font-weight:600;line-height:1.2}
.kopf .status{font-size:13px;opacity:.8;line-height:1.3;margin-top:2px}
.kopf .ikonen{display:flex;gap:20px;align-items:center;opacity:.95}
.kopf .ikonen svg{width:22px;height:22px;fill:#fff}
/* ---------- Verlauf ---------- */
.verlauf{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 16px 18px;background-color:var(--papier);
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'%3E%3Cg fill='none' stroke='%23e0d8ce' stroke-width='1.5' stroke-linecap='round'%3E%3Cpath d='M18 22c4-6 10-6 14 0'/%3E%3Ccircle cx='86' cy='26' r='7'/%3E%3Cpath d='M30 70h16M38 62v16'/%3E%3Cpath d='M74 84c6-4 12 2 8 8'/%3E%3Cpath d='M100 58l8 8-8 8'/%3E%3Cpath d='M12 100c6 4 12 4 18 0'/%3E%3C/g%3E%3C/svg%3E");
  background-repeat:repeat;
}
.trenner{display:flex;justify-content:center;margin:16px 0 12px}
.trenner span{
  background:#e1f2fb;color:#4a5b63;font-size:13px;
  padding:6px 13px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.08);
}
.monat{display:flex;justify-content:center;margin:24px 0 6px}
.monat span{
  background:rgba(7,94,84,.10);color:#0b6b60;font-size:13px;font-weight:700;
  letter-spacing:.10em;text-transform:uppercase;padding:6px 16px;border-radius:8px;
}
.verlauf > .monat:first-child{margin-top:4px}
/* ---------- Nachrichten ---------- */
.zeile{display:flex;align-items:flex-end;gap:8px;margin:3px 0}
.zeile.eigen{flex-direction:row-reverse}
.zeile .avatar{
  width:32px;height:32px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  margin-bottom:2px;box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.blase{
  position:relative;max-width:min(74%,560px);background:var(--blase-fremd);
  border-radius:10px;padding:7px 11px 6px;box-shadow:0 1px 1px rgba(0,0,0,.13);
  word-wrap:break-word;
}
.zeile.eigen .blase{background:var(--gruen-eigen)}
.blase.erste::after{content:"";position:absolute;top:0;width:0;height:0;border:8px solid transparent}
.zeile:not(.eigen) .blase.erste::after{left:-7px;border-top-color:var(--blase-fremd);border-left:0}
.zeile.eigen .blase.erste::after{right:-7px;border-top-color:var(--gruen-eigen);border-right:0}
.txt{font-size:16.5px;line-height:1.38;white-space:pre-wrap}
.zeit{
  float:right;margin:6px 0 -2px 10px;font-size:11.5px;color:var(--grau);
  white-space:nowrap;display:flex;align-items:center;gap:3px;
}
.zeit svg{width:15px;height:15px;fill:var(--haken)}
/* ---------- Bildanhang ---------- */
.anhang{width:min(54vw,208px);border-radius:7px;overflow:hidden;background:#cfd8d4;position:relative;display:block}
.anhang .flaeche{
  width:100%;aspect-ratio:3/4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;color:#5d6b66;
}
.anhang img{width:100%;display:block;object-fit:cover;aspect-ratio:3/4}
.anhang .flaeche svg{width:44px;height:44px;fill:#7b8a85}
.anhang .flaeche b{font-size:13px;font-weight:600;letter-spacing:.04em}
.anhang .flaeche small{font-size:11px;opacity:.75}
.blase.bild{padding:4px 4px 5px}
.blase.bild .zeit{
  position:absolute;right:11px;bottom:10px;float:none;margin:0;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);
}
.blase.bild .zeit svg{fill:#fff}
/* ---------- Sprachnachricht ---------- */
.blase.ton{min-width:min(72vw,300px)}
.ton-reihe{display:flex;align-items:center;gap:10px;padding:2px 0 1px}
.abspielen{
  width:34px;height:34px;flex:0 0 auto;border:0;background:none;padding:0;
  cursor:pointer;color:#5b6b73;display:flex;align-items:center;justify-content:center;
}
.abspielen svg{width:28px;height:28px;fill:currentColor}
.welle{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.welle i{flex:1;background:#b9c3c7;border-radius:1px;min-width:2px;display:block}
.welle i.an{background:#4b9ee0}
.dauer{font-size:12px;color:var(--grau);white-space:nowrap}
.mikro{width:16px;height:16px;fill:#8d9a9f;flex:0 0 auto}
/* ---------- Eingabeleiste ---------- */
.fuss{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#f0f0f0;
}
.feld{flex:1;background:#fff;border-radius:22px;padding:11px 16px;color:#9aa5ab;font-size:16px;display:flex;align-items:center;gap:10px}
.feld svg{width:21px;height:21px;fill:#8696a0;flex:0 0 auto}
.feld span{flex:1}
.senden{width:46px;height:46px;border-radius:50%;background:var(--gruen-kopf);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.senden svg{width:22px;height:22px;fill:#fff}
@media (max-width:767px){ body{font-size:16px} .blase{max-width:82%} }
</style>
</head>

/* ---------- Datumsrechnung, oesterreichische Bezeichnungen ---------- */
const WOCHENTAG = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MONATSNAME = ["Jänner","Februar","März","April","Mai","Juni","Juli",
                    "August","September","Oktober","November","Dezember"];

function zwei(n){ return (n<10?"0":"") + n; }
function mitJahr(){ return DATEN.jahr === true; }

/* Der Tag der Nachricht: Beginndatum plus der Abstand dieses Tages. */
function tagDatum(nr){
  const ab = (DATEN.tage && DATEN.tage[nr] != null) ? DATEN.tage[nr] : 0;
  const d = new Date(DATEN.start + "T12:00:00");
  d.setDate(d.getDate() + ab);
  return d;
}

/* Ausgeschriebene Datumsangaben. Die Jahreszahl steht nur dabei,
   wenn sie in den Daten eingeschaltet ist.  ->  "Sonntag, 22. März" */
function tagMonat(d){ return d.getDate() + ". " + MONATSNAME[d.getMonth()]; }
function langesDatum(d){
  return WOCHENTAG[d.getDay()] + ", " + tagMonat(d) + (mitJahr() ? " " + d.getFullYear() : "");
}
function monatText(d){
  return MONATSNAME[d.getMonth()] + (mitJahr() ? " " + d.getFullYear() : "");
}
/* Zum Vergleichen, ob ein neuer Monat beginnt: immer mit Jahr, damit
   derselbe Monat in zwei Jahren nicht zusammenfaellt. */
function monatSchluessel(d){ return d.getFullYear() + "-" + zwei(d.getMonth()+1); }

/* Zahlenformate fuer den Ausdruck. Die Aktenfelder behalten das Jahr. */
function kurzDatum(d){ return zwei(d.getDate()) + "." + zwei(d.getMonth()+1) + "." + d.getFullYear(); }
function stempelDatum(d){
  return mitJahr() ? kurzDatum(d) : zwei(d.getDate()) + "." + zwei(d.getMonth()+1) + ".";
}

/* letzter Tag des Verlaufs */
function letzterTag(){
  let g = 0;
  DATEN.n.forEach(m => { if((DATEN.tage[m.tag]||0) > g) g = DATEN.tage[m.tag]||0; });
  const d = new Date(DATEN.start + "T12:00:00");
  d.setDate(d.getDate() + g);
  return d;
}
function tagePlus(d, n){ const x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }

/* "zuletzt online" - wenn nichts eingetragen ist, aus der letzten
   Nachricht von Kracher berechnet. */
function statusZeile(){
  if(DATEN.status) return DATEN.status;
  let letzte = null;
  DATEN.n.forEach(m => { if(m.von === "ak") letzte = m; });
  if(!letzte) return "";
  const d = tagDatum(letzte.tag);
  return "zuletzt online am " + tagMonat(d) + (mitJahr() ? " " + d.getFullYear() : "") + " um " + letzte.zeit;
}
function sicherText(){
  return DATEN.sicher ? DATEN.sicher : kurzDatum(tagePlus(letzterTag(), 8));
}
function extrahiertText(){
  return DATEN.extrahiert ? DATEN.extrahiert : kurzDatum(tagePlus(letzterTag(), 9)) + ", 09:22 Uhr";
}
function zeitraumText(){
  const tage = DATEN.n.map(m => DATEN.tage[m.tag]||0);
  const von = tagePlus(new Date(DATEN.start+"T12:00:00"), Math.min.apply(null,tage));
  const bis = tagePlus(new Date(DATEN.start+"T12:00:00"), Math.max.apply(null,tage));
  return kurzDatum(von) + " – " + kurzDatum(bis);
}
function anzahlText(){
  let t=0,b=0,o=0;
  DATEN.n.forEach(m => { if(m.art==="bild") b++; else if(m.art==="ton") o++; else t++; });
  const teile = [];
  if(t) teile.push(t + " Text");
  if(b) teile.push(b + " Bild");
  if(o) teile.push(o + " Audio");
  return DATEN.n.length + " (" + teile.join(", ") + ")";
}
function esc(t){
  return String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* Form der Welle der Sprachnachricht, fest, damit sie immer gleich aussieht. */
const WELLE = [3,6,4,9,14,11,17,22,16,10,7,12,19,24,20,13,8,5,9,15,21,26,18,12,7,10,16,23,19,11,6,9,13,8,5,7,4,6,3,5];

const HAKEN = '<svg viewBox="0 0 18 18"><path d="M17.1 5.2l-.9-.8a.3.3 0 0 0-.45.03l-6.3 7.9-.35-.3a.3.3 0 0 0-.44.04l-.75.95a.3.3 0 0 0 .03.42l1.5 1.3a.3.3 0 0 0 .44-.04l7.3-9.1a.3.3 0 0 0-.08-.4zm-5 0l-.9-.8a.3.3 0 0 0-.45.03L4.5 12.3 1.9 10a.3.3 0 0 0-.44.04l-.75.95a.3.3 0 0 0 .03.42l3.7 3.2a.3.3 0 0 0 .44-.04l7.3-9.1a.3.3 0 0 0-.08-.4z"/></svg>';

function zeitblock(m){
  return '<span class="zeit">' + esc(m.zeit) + (m.von === "cr" ? HAKEN : "") + '</span>';
}

function aufbauen(){
  const v = document.getElementById("verlauf");
  let html = "", vorher = null, letzterM = "", letzterT = -1;

  DATEN.n.forEach(m => {
    const d  = tagDatum(m.tag);
    const sl = monatSchluessel(d);
    if(sl !== letzterM){
      html += '<div class="monat"><span>' + esc(monatText(d)) + '</span></div>';
      letzterM = sl; letzterT = -1; vorher = null;
    }
    if(m.tag !== letzterT){
      html += '<div class="trenner"><span>' + esc(langesDatum(d)) + '</span></div>';
      letzterT = m.tag; vorher = null;
    }

    const eigen = m.von === "cr";
    const erste = vorher !== m.von;
    const bild  = eigen ? BILD_CLARA : BILD_KRACHER;
    const wer   = eigen ? "Clara Roithamer" : DATEN.kontakt;
    let klasse = "", inhalt;

    if(m.art === "bild"){
      klasse = " bild";
      inhalt = '<div class="anhang" id="anhang">' +
                 '<div class="flaeche">' +
                   '<svg viewBox="0 0 24 24"><path d="M9 3h6l1.5 2H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3.5L9 3zm3 4.5A4.5 4.5 0 1 0 12 16.5 4.5 4.5 0 0 0 12 7.5zm0 2A2.5 2.5 0 1 1 12 14.5 2.5 2.5 0 0 1 12 9.5z"/></svg>' +
                   '<b>Foto</b><small>' + esc(DATEN.bildname) + '</small>' +
                 '</div></div>' + zeitblock(m);
    }else if(m.art === "ton"){
      klasse = " ton";
      const balken = WELLE.map(h => '<i style="height:' + h + 'px"></i>').join("");
      inhalt = '<div class="ton-reihe">' +
                 '<button class="abspielen" id="tonKnopf" aria-label="Sprachnachricht abspielen">' +
                   '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>' +
                 '<div class="welle" id="welle">' + balken + '</div>' +
                 '<svg class="mikro" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg>' +
               '</div><span class="dauer" id="tonDauer">' + esc(m.text || "0:42") + '</span>' + zeitblock(m);
    }else{
      inhalt = '<div class="txt">' + esc(m.text) + zeitblock(m) + '</div>';
    }

    html += '<div class="zeile ' + (eigen?"eigen":"") + '">' +
              '<img class="avatar" src="' + bild + '" alt="' + esc(wer) + '">' +
              '<div class="blase' + klasse + ' ' + (erste?"erste":"") + '">' + inhalt + '</div>' +
            '</div>';
    vorher = m.von;
  });

  v.innerHTML = html;
  document.getElementById("kopfbild").src = BILD_KRACHER;
  document.getElementById("kopfname").textContent = DATEN.kontakt;
  document.getElementById("kopfstatus").textContent = statusZeile();
}

/* ------------------------------------------------------------------
   Das Foto im Chat.
   1. Steckt eines in den Daten (in der Startseite gewaehlt), wird es
      genommen. 2. Sonst "Clara.jpg" neben dieser Datei.
   3. Sonst ein am Geraet gewaehltes Bild (Taste B).
   4. Sonst bleibt die graue Platzhalterflaeche stehen.
   ------------------------------------------------------------------ */
const BILD_VARIANTEN = [
  "Clara.jpg","Clara.JPG","Clara.jpeg","Clara.JPEG","Clara.png","Clara.PNG",
  "clara.jpg","clara.png","Chatfoto.jpg","Chatfoto.JPG","chatfoto.jpg"
];
function bildSetzen(quelle){
  const a = document.getElementById("anhang");
  if(!a) return;
  a.innerHTML = '<img src="' + quelle + '" alt="Foto">';
}
function dateiSuchen(i){
  if(i >= BILD_VARIANTEN.length){ manuellesBild(); return; }
  const pr = new Image();
  pr.onload  = () => bildSetzen(BILD_VARIANTEN[i]);
  pr.onerror = () => dateiSuchen(i+1);
  pr.src = BILD_VARIANTEN[i];
}
function manuellesBild(){
  try{ const g = localStorage.getItem("chat_ck_bild"); if(g) bildSetzen(g); }catch(e){}
}
document.getElementById("bildwahl").addEventListener("change", ev => {
  const d = ev.target.files && ev.target.files[0];
  if(!d) return;
  const l = new FileReader();
  l.onload = () => {
    bildSetzen(l.result);
    try{ localStorage.setItem("chat_ck_bild", l.result); }catch(e){}
    ansEnde();
  };
  l.readAsDataURL(d);
});

/* ---------- Sprachnachricht ---------- */
let tonLaeuft = null;
function tonStarten(){
  const w = document.getElementById("welle");
  const k = document.getElementById("tonKnopf");
  const a = document.getElementById("tonDauer");
  if(!w) return;
  const balken = [...w.children];
  const text = a.getAttribute("data-soll") || a.textContent;
  a.setAttribute("data-soll", text);
  if(tonLaeuft){
    clearInterval(tonLaeuft); tonLaeuft = null;
    k.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    balken.forEach(b => b.classList.remove("an"));
    a.textContent = text;
    return;
  }
  const teile = text.split(":");
  const gesamt = Math.max(1, (parseInt(teile[0],10)||0)*60 + (parseInt(teile[1],10)||0));
  k.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  let s = 0;
  tonLaeuft = setInterval(() => {
    s++;
    const anteil = s / gesamt;
    balken.forEach((b,i) => b.classList.toggle("an", i/balken.length < anteil));
    a.textContent = Math.floor(s/60) + ":" + zwei(s%60);
    if(s >= gesamt){
      clearInterval(tonLaeuft); tonLaeuft = null;
      balken.forEach(b => b.classList.remove("an"));
      a.textContent = text;
      k.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    }
  }, 1000);
}

function ansEnde(){
  const v = document.getElementById("verlauf");
  v.scrollTop = v.scrollHeight;
}

aufbauen();
ansEnde();
requestAnimationFrame(ansEnde);
window.addEventListener("load", ansEnde);
setTimeout(ansEnde, 120);
setTimeout(ansEnde, 400);

const tk = document.getElementById("tonKnopf");
if(tk) tk.addEventListener("click", tonStarten);
if(DATEN.bild) bildSetzen(DATEN.bild); else dateiSuchen(0);

/* Taste B: eigenes Foto vom Geraet. Taste 0: wieder vergessen. */
document.addEventListener("keydown", e => {
  const t = (e.key || "").toLowerCase();
  if(t === "b"){ document.getElementById("bildwahl").click(); }
  if(t === "0"){ try{ localStorage.removeItem("chat_ck_bild"); }catch(x){} location.reload(); }
});
</script>
